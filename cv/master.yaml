experience:
  - company: Craft-Labs
    position: {en: Architect / Technical Lead, es: Arquitecto / Líder Técnico}
    location: Buenos Aires, AR
    start_date: 2026-03
    end_date: present
    highlights:
      - id: teams
        rank: {em: 1}
        en: "Lead two engineering teams (7 people) that ship in 2-week iterations: I run capacity planning, iteration demos to stakeholders and the technical roadmap."
        es: "Lidero dos equipos de ingeniería (7 personas) que entregan en iteraciones de 2 semanas: planificación por capacidad, demos a stakeholders y roadmap técnico."
      - id: platform
        rank: {em: 2}
        en: Own the architecture and delivery of the company's operations platform (SOWs, allocations, invoicing, performance feedback, compensation; ~20 screens, 8 roles) on .NET, Angular, Azure Functions and SQL Server, orchestrated with .NET Aspire.
        es: Responsable de la arquitectura y la entrega de la plataforma de operaciones de la empresa (SOWs, asignaciones, facturación, feedback, compensaciones; ~20 pantallas, 8 roles) en .NET, Angular, Azure Functions y SQL Server con .NET Aspire.
      - id: review
        rank: {em: 4, ai: 2}
        en: "Designed the AI-assisted code review process the teams run on every pull request: 5 agents in parallel (checks, standards, spec, tests, security) that handle stacked chains of up to 13 PRs and enforce the coding and architecture standards I define."
        es: "Diseñé el proceso de revisión asistido por IA que los equipos aplican a cada pull request: 5 agentes en paralelo (checks, estándares, spec, tests, seguridad) que cubren cadenas de hasta 13 PRs apilados y hacen valer los estándares que defino."
      - id: bugsweep
        in: [generic, ai, em]
        rank: {ai: 1}
        en: "Created a repeatable autonomous bug-sweep process with parallel coding agents (12 hunt rounds, ~9 fix agents per run). First run: 65 pull requests and 74 bugs traced to the change that introduced them, in 7.5 unattended hours."
        es: "Creé un proceso repetible de barrida de bugs autónoma con agentes en paralelo (12 rondas, ~9 agentes de fix por corrida). Primera corrida: 65 pull requests y 74 bugs rastreados hasta el cambio que los introdujo, en 7,5 horas sin intervención."
      - id: qa
        in: [generic, ai, em]
        rank: {ai: 3}
        en: "Built the AI-assisted regression QA process (plan, run, triage): agents derive the test cases from merged PRs, run them in Playwright with video evidence and file the bugs. First pass: 56 cases from 90 PRs, 10 bugs reported."
        es: "Construí el proceso de QA de regresión asistido por IA (plan, ejecución, triage): los agentes derivan los casos de los PRs mergeados, los corren en Playwright con video y reportan los bugs. Primera pasada: 56 casos de 90 PRs, 10 bugs."
      - id: quality
        rank: {staff: 1}
        en: "Built the platform's quality system: ratcheted architecture tests, mutation testing (Stryker), analyzer and lint ratchets, and suites of ~3,000 unit, 1,600 integration (Testcontainers) and 4,400 UI tests. Cut CI spend with on-demand checks and local integration runs from 22 to 3 minutes."
        es: "Construí el sistema de calidad de la plataforma: tests de arquitectura, mutation testing (Stryker), ratchets de analizadores y lint, y suites de ~3.000 tests unitarios, 1.600 de integración (Testcontainers) y 4.400 de UI. Reduje el gasto de CI con checks bajo demanda y la integración local de 22 a 3 min."
      - id: atdd
        in: [staff, ai, sa]
        rank: {ai: 4, staff: 2}
        en: Created atdd-kit, a guardrail system that keeps AI-generated code within the architecture. It generates specs with OpenSpec, enforces 160+ architecture rules as automated tests and blocks non-compliant changes in GitHub Actions CI.
        es: Creé atdd-kit, un sistema de guardrails que mantiene el código generado por IA dentro de la arquitectura. Genera specs con OpenSpec, valida más de 160 reglas de arquitectura como tests automatizados y bloquea en el CI de GitHub Actions los cambios que no las cumplen.
      - id: design
        in: [staff, sa]
        rank: {sa: 2, staff: 3}
        en: "Designed the platform's core mechanisms and documented them as ADRs (90+ in the repo): the authorization model (scoped read/write data, per-role field mapping), the audit trail (temporal tables, EF Core interceptor) and the Engagement/Company data restructuring."
        es: "Diseñé los mecanismos centrales de la plataforma y los documenté como ADRs (más de 90 en el repo): el modelo de autorización (datos de lectura/escritura con alcance, mapeo de campos por rol), la auditoría (tablas temporales, interceptor de EF Core) y la reestructuración de datos Engagement/Company."
      - id: security
        in: [generic, staff, sa]
        rank: {sa: 3}
        en: "Hardened the platform's Azure footprint end to end: identity-based access between services, closed network exposure and restricted SQL Server access."
        es: "Reforcé la seguridad de la plataforma en Azure de punta a punta: acceso por identidad entre servicios, red cerrada y SQL Server restringido."
      - id: litellm
        in: [generic, ai, sa, staff]
        rank: {ai: 5, sa: 1}
        en: "Designed and built the company-wide LLM gateway (LiteLLM) for engineers and for products with agentic capabilities, local and hosted models, as a production-grade Azure deployment with spend tracking per team and model: Terraform (24 resources), App Service, private PostgreSQL, Key Vault, Entra ID, Application Insights, budget alerts."
        es: "Diseñé y construí el gateway de LLMs de toda la empresa (LiteLLM), para ingenieros y para productos con capacidades agénticas, con modelos locales y de suscripción, como despliegue productivo en Azure con gasto por equipo y modelo: Terraform (24 recursos), App Service, PostgreSQL privado, Key Vault, Entra ID, Application Insights, alertas de presupuesto."
      - id: skills
        in: [generic, ai, em]
        rank: {ai: 6}
        en: "Built the teams' agentic development toolkit: 30+ Claude Code skills for the whole cycle (spec, change, review, QA, release, daily reports) plus a shared context and memory layer across AI coding agents, so every engineer works the same way with AI."
        es: "Construí el kit de desarrollo agéntico de los equipos: más de 30 skills de Claude Code para todo el ciclo (spec, cambio, revisión, QA, release, reportes) y una capa compartida de contexto y memoria entre agentes, para que todos trabajen igual con IA."
      - id: likec4
        in: [sa]
        rank: {sa: 4}
        en: Established architecture-as-code with LikeC4, a Claude Code bootstrap that scaffolds new architecture repositories in minutes, and 7 multi-language .NET Aspire starters (C#, TypeScript, Python, Go) that make new services consistent from day one.
        es: Instalé arquitectura como código con LikeC4, un bootstrap con Claude Code que genera repositorios de arquitectura en minutos y 7 starters multilenguaje de .NET Aspire (C#, TypeScript, Python, Go) que hacen consistentes los servicios nuevos desde el primer día.
      - id: people
        in: [generic, em]
        rank: {em: 3}
        en: "Own people development: weekly performance evaluations for all 7 team members, the onboarding plan that brought 5 hires up to speed in 2026, and the company-wide performance feedback cycle as product owner of that module."
        es: "Responsable del desarrollo de las personas: evaluaciones semanales a las 7, el plan de onboarding con el que incorporé 5 ingresos en 2026 y el ciclo de feedback de desempeño de toda la empresa como dueño del módulo."

