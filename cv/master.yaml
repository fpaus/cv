# Single source of truth for every CV variant and language.
# scripts/build_cvs.py turns this file into RenderCV inputs under generated/.
#
# Conventions:
#   - Any text value can be a plain string (same in every language)
#     or a mapping {en: ..., es: ...}.
#   - `in: [variant, ...]` limits an item to those variants. No `in` means all variants.
#   - `rank: {variant: n}` moves an item up for that variant (lower first).
#     Unranked items keep their file order after the ranked ones.

